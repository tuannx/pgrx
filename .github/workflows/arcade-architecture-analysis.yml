name: Arcade Architecture Analysis

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: Arcade Architecture Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Run arcade-agent architecture analysis
        uses: arcade-agent/arcade-agent/actions/analyze@v0.4.2
        with:
          arcade-agent-version: "0.4.2"
          source-path: "."
          language: "rust"
          install-extras: "[languages]"
          run-secondary-analyses: "false"
          post-pr-comment: "true"
